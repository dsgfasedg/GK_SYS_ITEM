services:
  - type: web
    name: gk-zhixue-backend
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JAVA_TOOL_OPTIONS
        value: -Xmx300m -Xss512k -XX:MaxMetaspaceSize=128m
      # 数据库连接（在 Render 控制台填写，支持 Aiven / 云数据库 MySQL）
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DEEPSEEK_API_KEY
        sync: false
      # 前端域名，多个用英文逗号分隔，例如 https://gk-zhixue.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        sync: false
