server:
  port: 8080

spring:
  application:
    name: gk-zhixue-assistant
  
  datasource:
    url: jdbc:h2:mem:gk_assistant;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  
  h2:
    console:
      enabled: true
      path: /h2-console
  
  # 使用 schema.sql 初始化 H2 数据库
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql
      data-locations: classpath:data-h2.sql

# MyBatis-Plus 配置
mybatis-plus:
  global-config:
    db-config:
      id-type: auto
      table-underline: true
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

jwt:
  secret: ${JWT_SECRET:gk-zhixue-assistant-secret-key-2026}
  expiration: ${JWT_EXPIRATION:86400000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

ai:
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:your-deepseek-api-key}
    base-url: https://api.deepseek.com
    model-name: deepseek-chat
    max-tokens: 4096
    temperature: 0.1
    top-p: 0.9
    retry-count: 3
    timeout-ms: 30000

logging:
  level:
    com.gk.zhixue: DEBUG
    org.springframework.web: INFO
