server:
  port: 8080

spring:
  application:
    name: gk-zhixue-assistant

  datasource:
    url: ${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:gk_assistant}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    timeout: 6000ms

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:50MB}

# MyBatis-Plus 配置
mybatis-plus:
  global-config:
    db-config:
      id-type: auto
      table-underline: true
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

jwt:
  secret: ${JWT_SECRET:gk-zhixue-assistant-secret-key-2026}
  expiration: ${JWT_EXPIRATION:86400000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

ai:
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:your-api-key}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    model-name: ${DEEPSEEK_MODEL_NAME:deepseek-chat}
    max-tokens: ${DEEPSEEK_MAX_TOKENS:4096}
    temperature: ${DEEPSEEK_TEMPERATURE:0.1}
    top-p: ${DEEPSEEK_TOP_P:0.9}
    retry-count: ${DEEPSEEK_RETRY_COUNT:3}
    timeout-ms: ${DEEPSEEK_TIMEOUT_MS:30000}

    presets:
      plan-ocr:
        max-tokens: 2048
        temperature: 0.05
      note-organize:
        max-tokens: 2048
        temperature: 0.1
      error-parse:
        max-tokens: 2048
        temperature: 0.05
      essay-correct:
        max-tokens: 8192
        temperature: 0.2
      question-extract:
        max-tokens: 2048
        temperature: 0.05

  ocr:
    baidu:
      app-id: ${BAIDU_OCR_APP_ID:your-app-id}
      api-key: ${BAIDU_OCR_API_KEY:your-api-key}
      secret-key: ${BAIDU_OCR_SECRET_KEY:your-secret-key}

oss:
  aliyun:
    access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID:your-access-key}
    access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:your-secret-key}
    endpoint: ${ALIYUN_OSS_ENDPOINT:oss-cn-hangzhou.aliyuncs.com}
    bucket-name: ${ALIYUN_OSS_BUCKET_NAME:your-bucket}

logging:
  level:
    com.gk.zhixue: DEBUG
    org.springframework.web: INFO
